# Configuración de la API de predicción de obesidad
# Configuración production-ready para FastAPI service

# Configuración de la aplicación
app:
  title: "Obesity Prediction API"
  description: "Production-ready ML API for obesity prediction with MLOps best practices"
  version: "1.0.0"
  enable_docs: true  # Deshabilitar en producción si es necesario
  contact:
    name: "MLOps Team"
    email: "mlops@obesity-prediction.com"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"

# Configuración del servidor
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4  # Para production con gunicorn/uvicorn
  reload: false  # Solo true en desarrollo
  log_level: "info"
  access_log: true
  timeout_keep_alive: 65
  max_requests: 1000
  max_requests_jitter: 50

# Configuración de modelos
model:
  # MLflow configuration
  use_mlflow: true
  mlflow_model_name: "obesity_prediction_model"
  mlflow_stage: "Production"  # También: "Staging", "Archived"
  mlflow_fallback_stage: "Staging"  # Fallback si Production no disponible
  
  # Local model paths (fallback)
  local_model_path: "artifacts/training/random_forest_model.pkl"
  local_preprocessing_path: "artifacts/preprocessing/preprocessing_pipeline.pkl"
  
  # Cache configuration
  cache_ttl_seconds: 3600  # 1 hora
  enable_model_cache: true
  max_cache_size_mb: 500
  
  # Model validation
  validate_model_on_load: true
  model_health_check_interval: 300  # 5 minutos
  
  # Fallback models
  fallback_models:
    - name: "simple_baseline"
      path: "artifacts/training/baseline_model.pkl"
      description: "Simple baseline model for fallback"

# Configuración de predicción
prediction:
  # Timeouts y limits
  prediction_timeout_seconds: 30
  max_batch_size: 100
  enable_batch_prediction: false
  
  # Monitoring
  log_predictions: true
  log_prediction_details: false  # Solo para debugging
  enable_prediction_metrics: true
  
  # Quality checks
  enable_input_validation: true
  enable_output_validation: true
  confidence_threshold: 0.7  # Threshold para alertas de baja confianza
  
  # Data drift monitoring
  enable_drift_detection: true
  drift_reference_data_path: "artifacts/monitoring/reference_data.parquet"
  drift_check_interval: 1000  # Cada N predicciones
  
  # Explanation
  enable_explanations: true
  explanation_method: "simple"  # simple, lime, shap (para futuro)

# Configuración de CORS
cors:
  enabled: true
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "https://obesity-prediction-ui.azurewebsites.net"
  allow_credentials: true
  allow_methods: ["GET", "POST", "OPTIONS"]
  allow_headers: ["*"]
  expose_headers: ["X-Process-Time", "X-Request-ID"]

# Configuración de seguridad
security:
  # Trusted hosts (production)
  trusted_hosts:
    - "obesity-prediction-api.azurewebsites.net"
    - "localhost"
    - "127.0.0.1"
  
  # Rate limiting
  enable_rate_limiting: true
  rate_limit_requests: 100  # requests per minute
  rate_limit_window: 60  # seconds
  
  # Authentication (para endpoints administrativos)
  enable_auth: false  # Cambiar a true en production
  auth_method: "bearer"  # bearer, api_key, oauth2
  
  # Headers de seguridad
  security_headers:
    - "X-Content-Type-Options: nosniff"
    - "X-Frame-Options: DENY"
    - "X-XSS-Protection: 1; mode=block"
    - "Strict-Transport-Security: max-age=31536000; includeSubDomains"

# Configuración de logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json, text
  
  # Log files
  enable_file_logging: true
  log_file_path: "logs/api/api.log"
  log_file_max_size_mb: 100
  log_file_backup_count: 5
  
  # Request logging
  log_requests: true
  log_response_body: false  # Solo para debugging
  log_headers: false  # Solo para debugging
  
  # Performance logging
  log_slow_requests: true
  slow_request_threshold_seconds: 1.0

# Configuración de monitoreo
monitoring:
  # Health checks
  enable_health_checks: true
  health_check_timeout: 5
  
  # Metrics
  enable_metrics: true
  metrics_endpoint: "/metrics"  # Prometheus format
  
  # System metrics
  collect_system_metrics: true
  system_metrics_interval: 30  # seconds
  
  # Application metrics
  collect_prediction_metrics: true
  collect_error_metrics: true
  collect_latency_metrics: true
  
  # External monitoring
  enable_azure_monitoring: true
  application_insights_key: "${APPLICATION_INSIGHTS_KEY}"
  
  # Alerting
  enable_alerting: true
  alert_on_high_error_rate: true
  error_rate_threshold: 0.05  # 5%
  alert_on_high_latency: true
  latency_threshold_ms: 1000

# Configuración de caché
cache:
  enabled: true
  backend: "memory"  # memory, redis, memcached
  
  # Memory cache
  max_size_mb: 100
  ttl_seconds: 300  # 5 minutos
  
  # Redis cache (si se usa)
  redis_url: "redis://localhost:6379/0"
  redis_password: "${REDIS_PASSWORD}"
  redis_ssl: false

# Configuración de base de datos (para logs y metrics)
database:
  enabled: false  # Para futuras implementaciones
  url: "postgresql://user:pass@localhost:5432/mlops_api"
  pool_size: 5
  max_overflow: 10
  
  # Tablas
  prediction_logs_table: "prediction_logs"
  metrics_table: "api_metrics"
  health_logs_table: "health_logs"

# Configuración de desarrollo
development:
  auto_reload: true
  debug_mode: false
  enable_profiling: false
  profiling_sample_rate: 0.1
  
  # Test data
  enable_test_endpoints: false  # Solo en desarrollo
  test_data_path: "data/test/api_test_data.json"

# Configuración de producción
production:
  worker_class: "uvicorn.workers.UvicornWorker"
  worker_connections: 1000
  keepalive: 2
  
  # SSL/TLS
  ssl_keyfile: "${SSL_KEYFILE}"
  ssl_certfile: "${SSL_CERTFILE}"
  ssl_ca_cert: "${SSL_CA_CERT}"
  
  # Graceful shutdown
  graceful_timeout: 30
  max_requests_jitter: 100
  
  # Preload
  preload_app: true
  
# Variables de entorno
environment_variables:
  # MLflow
  MLFLOW_TRACKING_URI: "https://your-mlflow-server.com"
  MLFLOW_REGISTRY_URI: "https://your-mlflow-server.com"
  
  # Azure
  AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
  AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
  AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
  
  # Application Insights
  APPLICATION_INSIGHTS_KEY: "${APPLICATION_INSIGHTS_KEY}"
  
  # Database
  DATABASE_URL: "${DATABASE_URL}"
  
  # Cache
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  
  # SSL
  SSL_KEYFILE: "${SSL_KEYFILE}"
  SSL_CERTFILE: "${SSL_CERTFILE}"
  SSL_CA_CERT: "${SSL_CA_CERT}"

# Configuración de testing
testing:
  test_client_timeout: 10
  mock_model_responses: false
  test_data_seed: 42
  
  # Test coverage
  minimum_test_coverage: 0.80
  test_reports_path: "reports/api_tests/"
  
  # Load testing
  load_test_users: 50
  load_test_duration: 300  # seconds
  load_test_ramp_up: 60  # seconds