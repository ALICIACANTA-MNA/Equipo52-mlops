# Configuración de producción para la API de predicción de obesidad
# Configuración optimizada para despliegue en Azure/cloud

# Configuración de la aplicación
app:
  title: "Obesity Prediction API"
  description: "Production ML API for obesity prediction with MLOps best practices"
  version: "1.0.0"
  enable_docs: false  # Deshabilitado en producción por seguridad
  contact:
    name: "MLOps Team Equipo 52"
    email: "mlops-equipo52@company.com"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"

# Configuración del servidor para producción
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4  # Ajustar según CPU disponible
  worker_class: "uvicorn.workers.UvicornWorker"
  worker_connections: 1000
  reload: false
  log_level: "info"
  access_log: true
  timeout_keep_alive: 65
  max_requests: 1000
  max_requests_jitter: 50
  preload_app: true
  graceful_timeout: 30

# Configuración de modelos para producción
model:
  # MLflow configuration
  use_mlflow: true
  mlflow_model_name: "obesity_prediction_production"
  mlflow_stage: "Production"
  mlflow_fallback_stage: "Staging"
  
  # Cache configuration optimizada
  cache_ttl_seconds: 7200  # 2 horas en producción
  enable_model_cache: true
  max_cache_size_mb: 1000  # 1GB para producción
  
  # Model validation estricta
  validate_model_on_load: true
  model_health_check_interval: 600  # 10 minutos
  
  # Fallback models
  fallback_models:
    - name: "baseline_production"
      path: "artifacts/training/baseline_model.pkl"
      description: "Production baseline model"

# Configuración de predicción para producción
prediction:
  # Timeouts estrictos
  prediction_timeout_seconds: 10  # Más estricto en producción
  max_batch_size: 50  # Reducido para producción
  enable_batch_prediction: false
  
  # Monitoring completo
  log_predictions: true
  log_prediction_details: false  # No logear detalles sensibles
  enable_prediction_metrics: true
  
  # Quality checks estrictos
  enable_input_validation: true
  enable_output_validation: true
  confidence_threshold: 0.8  # Más estricto en producción
  
  # Data drift monitoring activo
  enable_drift_detection: true
  drift_reference_data_path: "artifacts/monitoring/reference_data.parquet"
  drift_check_interval: 500  # Más frecuente en producción

# Configuración de CORS restrictiva para producción
cors:
  enabled: true
  allow_origins:
    - "https://obesity-prediction-ui.azurewebsites.net"
    - "https://company-dashboard.com"
  allow_credentials: false  # Más seguro en producción
  allow_methods: ["GET", "POST", "OPTIONS"]
  allow_headers: 
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
  expose_headers: ["X-Process-Time"]

# Configuración de seguridad para producción
security:
  # Trusted hosts específicos
  trusted_hosts:
    - "obesity-prediction-api.azurewebsites.net"
    - "api.company.com"
    - "localhost"  # Solo para testing local
  
  # Rate limiting más estricto
  enable_rate_limiting: true
  rate_limit_requests: 60  # Más restrictivo en producción
  rate_limit_window: 60
  block_duration_seconds: 600  # 10 minutos
  
  # Authentication habilitada
  enable_auth: true
  auth_method: "bearer"
  
  # Headers de seguridad obligatorios
  security_headers:
    - "X-Content-Type-Options: nosniff"
    - "X-Frame-Options: DENY"
    - "X-XSS-Protection: 1; mode=block"
    - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
    - "Content-Security-Policy: default-src 'self'"
    - "Referrer-Policy: strict-origin-when-cross-origin"

# Configuración de logging para producción
logging:
  level: "INFO"
  format: "json"  # JSON para análisis automatizado
  
  # Log files con rotación
  enable_file_logging: true
  log_file_path: "/var/log/app/api.log"
  log_file_max_size_mb: 100
  log_file_backup_count: 10
  
  # Request logging limitado
  log_requests: true
  log_response_body: false
  log_headers: false
  
  # Performance logging crítico
  log_slow_requests: true
  slow_request_threshold_seconds: 0.5  # Más estricto

# Configuración de monitoreo completa para producción
monitoring:
  # Health checks críticos
  enable_health_checks: true
  health_check_timeout: 3  # Más rápido en producción
  
  # Metrics habilitadas
  enable_metrics: true
  metrics_endpoint: "/metrics"
  
  # System metrics detallados
  collect_system_metrics: true
  system_metrics_interval: 15  # Más frecuente
  
  # Application metrics completas
  collect_prediction_metrics: true
  collect_error_metrics: true
  collect_latency_metrics: true
  
  # Azure monitoring habilitado
  enable_azure_monitoring: true
  application_insights_key: "${APPLICATION_INSIGHTS_KEY}"
  
  # Alerting crítico
  enable_alerting: true
  alert_on_high_error_rate: true
  error_rate_threshold: 0.02  # 2% máximo
  alert_on_high_latency: true
  latency_threshold_ms: 500  # Más estricto
  
  # Prometheus metrics
  enable_prometheus: true
  prometheus_endpoint: "/metrics"

# Configuración de caché para producción
cache:
  enabled: true
  backend: "redis"  # Redis en producción
  
  # Redis production config
  redis_url: "${REDIS_URL}"
  redis_password: "${REDIS_PASSWORD}"
  redis_ssl: true
  redis_connection_pool_size: 20
  redis_timeout: 5
  
  # Cache settings
  max_size_mb: 500
  ttl_seconds: 600  # 10 minutos

# Configuración de base de datos para logs
database:
  enabled: true
  url: "${DATABASE_URL}"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  
  # Tablas
  prediction_logs_table: "prediction_logs"
  metrics_table: "api_metrics"
  health_logs_table: "health_logs"

# Configuración específica de producción
production:
  # Worker configuration
  worker_class: "uvicorn.workers.UvicornWorker"
  worker_connections: 1000
  keepalive: 2
  
  # SSL/TLS obligatorio
  ssl_keyfile: "${SSL_KEYFILE}"
  ssl_certfile: "${SSL_CERTFILE}"
  ssl_ca_cert: "${SSL_CA_CERT}"
  ssl_version: "TLSv1_2"
  ssl_ciphers: "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS"
  
  # Graceful shutdown
  graceful_timeout: 30
  max_requests_jitter: 100
  
  # Memory management
  max_memory_per_worker_mb: 512
  
  # Preload optimizations
  preload_app: true

# Variables de entorno requeridas en producción
environment_variables:
  # MLflow
  MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI}"
  MLFLOW_REGISTRY_URI: "${MLFLOW_REGISTRY_URI}"
  MLFLOW_S3_ENDPOINT_URL: "${MLFLOW_S3_ENDPOINT_URL}"
  
  # Azure
  AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
  AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
  AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
  AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID}"
  
  # Application Insights
  APPLICATION_INSIGHTS_KEY: "${APPLICATION_INSIGHTS_KEY}"
  APPLICATION_INSIGHTS_CONNECTION_STRING: "${APPLICATION_INSIGHTS_CONNECTION_STRING}"
  
  # Database
  DATABASE_URL: "${DATABASE_URL}"
  
  # Cache
  REDIS_URL: "${REDIS_URL}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  
  # SSL
  SSL_KEYFILE: "${SSL_KEYFILE}"
  SSL_CERTFILE: "${SSL_CERTFILE}"
  SSL_CA_CERT: "${SSL_CA_CERT}"
  
  # API Keys
  API_SECRET_KEY: "${API_SECRET_KEY}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"

# Health check endpoints para Kubernetes/Docker
health_checks:
  liveness_probe:
    path: "/health/live"
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    failure_threshold: 3
  
  readiness_probe:
    path: "/health/ready"
    initial_delay_seconds: 5
    period_seconds: 5
    timeout_seconds: 3
    failure_threshold: 3

# Configuración de alertas críticas
alerting:
  enable_alerting: true
  
  # Umbrales críticos
  critical_error_rate: 0.05  # 5%
  critical_latency_ms: 1000
  critical_memory_usage: 90  # 90%
  critical_cpu_usage: 85     # 85%
  
  # Canales de notificación
  notification_channels:
    - type: "webhook"
      url: "${ALERT_WEBHOOK_URL}"
    - type: "email"
      recipients: ["alerts@company.com"]

# Configuración de backup y recovery
backup:
  enable_model_backup: true
  backup_interval_hours: 24
  backup_retention_days: 30
  backup_location: "${BACKUP_STORAGE_URL}"

# Configuración de scaling automático
autoscaling:
  enable_horizontal_scaling: true
  min_replicas: 2
  max_replicas: 10
  
  # Métricas para scaling
  target_cpu_utilization: 70
  target_memory_utilization: 80
  target_requests_per_second: 100