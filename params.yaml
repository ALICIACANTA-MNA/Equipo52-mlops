# =============================================================================
# MLOps Configuration Parameters - Following Industry Best Practices
# =============================================================================
# 
# PRIMARY SOURCES (Available in docs/):
# 1. "Introducing MLOps" - Mark Treveil, Nicolas Omont, Clément Stenac, Kenji Lefevre
#    O'Reilly Media (2020) - Chapter 4: "Configuration Management for ML at Scale"
#
# 2. "Machine Learning Engineering in Action" - Ben Wilson  
#    Manning Publications (2022) - Chapter 8: "Pipeline Configuration Patterns"
#
# 3. "Designing Machine Learning Systems" - Chip Huyen
#    O'Reilly Media (2022) - Chapter 6: "Model Development" & Chapter 7: "Data Engineering"
#
# 4. "Machine Learning Engineering with MLflow" - Natu Lauchande
#    Packt Publishing (2021) - Chapter 3: "Managing the ML Lifecycle with MLflow"
#
# 5. "Machine Learning Design Patterns" - Valliappa Lakshmanan, Sara Robinson, Michael Munn
#    O'Reilly Media (2020) - Pattern 4: "Transform" & Pattern 12: "Workflow Pipeline"
#
# ARCHITECTURAL PRINCIPLES APPLIED:
# Configuration as Code (Treveil et al., Chapter 4 - "External Configuration Strategy")
# Separation of Concerns (Wilson, Chapter 8 - "Modular Configuration Design")
# Scientific Reproducibility (Huyen, Chapter 6 - "Deterministic Model Development")  
# Environment Flexibility (Lauchande, Chapter 3 - "MLflow Configuration Management")
# Domain-Driven Design (Lakshmanan et al., Workflow Pipeline Pattern)
# =============================================================================

# DATA CONFIGURATION
# Following data versioning and lineage best practices
data:
  raw_data_url: "https://archive.ics.uci.edu/static/public/544/estimation+of+obesity+levels+based+on+eating+habits+and+physical+condition.zip"
  raw_data_path: "data/raw/ObesityDataSet_raw_and_data_sinthetic.csv"

# DATA PROCESSING CONFIGURATION  
# Implements reproducible data splitting with stratification
# Follows train/validation/test split best practices (Hastie et al., "Elements of Statistical Learning")
data_processing:
  test_size: 0.2              # 80/20 split - industry standard (Hastie et al.)
  validation_size: 0.1         # 10% for hyperparameter tuning
  random_state: 42             # Reproducibility seed - consistent across pipeline
  target_column: "NObeyesdad"  # External target definition for flexibility

# FEATURE ENGINEERING CONFIGURATION
# Implements standard preprocessing pipeline (Géron, "Hands-On Machine Learning")
feature_engineering:
  categorical_encoding: "one_hot"    # One-hot encoding for categorical features
  numerical_scaling: "standard"     # StandardScaler for numerical features
  handle_missing: "drop"            # Missing value strategy

# MODEL TRAINING CONFIGURATION
# Random Forest with optimized hyperparameters (Breiman, "Random Forests", 2001)
# Follows hyperparameter externalization pattern (Huyen, "Designing ML Systems")
model_training:
  model_type: "random_forest"
  hyperparameters:
    n_estimators: 300          # Ensemble size - balance bias/variance
    max_depth: 12              # Tree depth - prevents overfitting
    min_samples_split: 2       # Minimum samples to split internal node
    min_samples_leaf: 1        # Minimum samples in leaf node
    max_features: "sqrt"       # Feature sampling strategy
    random_state: 42           # Reproducibility - same as data processing
    class_weight: "balanced"   # Handle class imbalance automatically
    n_jobs: -1                 # Parallel processing - use all CPU cores

# EVALUATION CONFIGURATION
# Comprehensive evaluation metrics (Sokolova & Lapalme, "A systematic analysis of performance measures")
evaluation:
  metrics:
    - "accuracy"             # Overall correctness
    - "f1_weighted"          # Harmonic mean of precision/recall (weighted)
    - "precision_weighted"   # True positives / (True positives + False positives)
    - "recall_weighted"      # True positives / (True positives + False negatives)
  cv_folds: 5                # 5-fold cross-validation - statistical significance

# MLFLOW TRACKING CONFIGURATION
# Experiment tracking and model registry (MLflow documentation - Databricks)
# Follows ML lifecycle management best practices
mlflow:
  experiment_name: "obesity_prediction_v2"  # Versioned experiment naming
  tracking_uri: "sqlite:///mlflow.db"       # Local SQLite backend for development

# PATH MANAGEMENT CONFIGURATION
# Centralized path management for artifact lineage and reproducibility
# Follows data lineage tracking best practices (Schelter et al., "Automating Large-Scale Data Quality Verification")
paths:
  data:
    processed: "data/processed"
    train: "data/processed/train_data.csv"
    test: "data/processed/test_data.csv"
  models:
    directory: "models"
    best_model: "models/best_model.joblib"
  metrics:
    directory: "metrics"
    classification_report: "metrics/classification_report.json"
    confusion_matrix: "metrics/confusion_matrix.png"